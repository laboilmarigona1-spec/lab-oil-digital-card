<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061a4d">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>LAB-OIL Premium Card</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:linear-gradient(180deg,#eef3fb,#fff);color:#071a49;min-height:100vh}
.wrap{max-width:460px;margin:auto;padding:22px 16px 34px}.brand{display:flex;align-items:center;gap:10px;margin:4px 4px 18px}.logo{width:44px;height:44px;border-radius:12px;background:#061a4d;display:grid;place-items:center;color:white;font-weight:900;font-size:20px}.brand b{font-size:22px;letter-spacing:.5px}.brand span{display:block;font-size:12px;color:#667085}
.card{background:linear-gradient(135deg,#071d55,#0b3c91 58%,#d83a32);border-radius:24px;padding:22px;color:#fff;box-shadow:0 18px 45px #071a4930;position:relative;overflow:hidden}.card:after{content:"";position:absolute;width:180px;height:180px;border:35px solid #ffffff18;border-radius:50%;right:-70px;top:-60px}.label{font-size:11px;letter-spacing:2px;opacity:.75}.name{font-size:27px;font-weight:800;margin-top:8px}.num{font-size:15px;letter-spacing:2px;margin-top:5px;opacity:.9}.row{display:flex;justify-content:space-between;align-items:end;margin-top:30px}.discount{font-size:24px;font-weight:900}.status{font-size:11px;background:#ffffff20;border:1px solid #ffffff35;padding:7px 10px;border-radius:99px}.panel{background:#fff;border-radius:22px;padding:18px;margin-top:16px;box-shadow:0 8px 28px #071a4912;text-align:center}.panel h2{font-size:17px;margin:0 0 14px}.qr{display:flex;justify-content:center;padding:8px}.qr img{border-radius:8px}.hint{font-size:12px;color:#667085;margin:8px 0 0}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.btn{border:0;border-radius:14px;padding:13px 8px;font-weight:800;font-size:13px;text-decoration:none;cursor:pointer}.apple{background:#050505;color:#fff}.google{background:#fff;border:1px solid #d0d5dd;color:#101828}.info{margin-top:16px;font-size:12px;color:#667085;text-align:center;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><div class="logo">L</div><div><b>LAB-OIL</b><span>Premium Card</span></div></div>
  <section class="card">
    <div class="label">LAB-OIL PREMIUM CARD</div>
    <div class="name">Shkelzen Sopa</div>
    <div class="num">15000916</div>
    <div class="row"><div><div class="label">PËRFITIMI</div><div class="discount">-5 CENT/LITËR</div></div><div class="status">● ACTIVE</div></div>
  </section>
  <section class="panel">
    <h2>Skano për përdorim</h2>
    <div class="qr" id="qrcode"></div>
    <div class="hint">Trego këtë QR në pikën LAB-OIL.</div>
    <div class="buttons">
      <button class="btn apple" onclick="alert('Apple Wallet do të aktivizohet në versionin e lidhur me Apple Developer.')"> Apple Wallet</button>
      <button class="btn google" onclick="alert('Google Wallet do të aktivizohet në versionin e lidhur me Google Wallet.')">＋ Google Wallet</button>
    </div>
  </section>
  <div class="info">Kartë digjitale LAB-OIL • Version demonstrues<br>www.laboil-ks.com</div>
</div>
<script>
const card="15000916";
const url=location.origin+"/c/"+card;
new QRCode(document.getElementById("qrcode"),{text:url,width:190,height:190,colorDark:"#061a4d",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.H});
</script>
</body></html>
